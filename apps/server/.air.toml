root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -p 1 -tags nomsgpack -o /tmp/air/main ."
  bin = "/tmp/air/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  poll = true
  poll_interval = 1000
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "1s"

[log]
  time = true

[misc]
  clean_on_exit = true
