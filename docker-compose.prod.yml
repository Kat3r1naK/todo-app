name: todo-prod

services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  cache:
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: todo-app-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      PORT: "8080"
      GIN_MODE: release
      DB_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ADDR: "cache:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  agent:
    image: todo-app-agent:${IMAGE_TAG:-latest}
    restart: always
    environment:
      PORT: "3001"
      TODO_API_URL: "http://api:8080"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      MODEL_ID: ${MODEL_ID:-deepseek-v4-pro}
      AGENT_DATA_DIR: /data
      SETTINGS_STORE: "redis"
      REDIS_ADDR: "cache:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      MODEL_SETTINGS_SECRET: ${MODEL_SETTINGS_SECRET}
    volumes:
      - agent_data:/data
    depends_on:
      api:
        condition: service_healthy

  web:
    image: todo-app-web:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${WEB_PORT_PROD:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_started

volumes:
  db_data:
  redis_data:
  agent_data:
